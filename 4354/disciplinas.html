<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiencia y Habilidades</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f5;color:#263445}
header{background:#183b56;color:white;text-align:center;padding:30px}
nav{background:#102b40;padding:15px;text-align:center}
nav a{color:white;text-decoration:none;margin:12px;font-weight:bold}
main{max-width:850px;margin:30px auto;background:white;padding:30px;border-radius:12px}
input,textarea{width:100%;padding:12px;margin:8px 0 18px;border:1px solid #bbb;border-radius:6px}
label{font-weight:bold}
button{background:#183b56;color:white;padding:12px 20px;border:0;border-radius:6px}
h2{color:#183b56}
@media(max-width:500px){
main{margin:15px;padding:18px}
nav a{display:inline-block;margin:5px}
}
</style>
</head>

<body>

<header>
<h1>EXPERIENCIA Y HABILIDADES</h1>
<p>Trayectoria laboral y capacidades</p>
</header>

<nav>
<a href="index.html">Inicio</a>
<a href="experiencia.html">Experiencia</a>
<a href="disciplinas.html">Disciplinas</a>
</nav>

<main>
<form>

<h2>Experiencia laboral</h2>

<label>Empresa o lugar de trabajo:</label>
<input type="text" placeholder="Nombre de la empresa">

<label>Cargo desempeñado:</label>
<input type="text" placeholder="Cargo">

<label>Fecha de inicio:</label>
<input type="date">

<label>Fecha de finalización:</label>
<input type="date">

<label>Funciones realizadas:</label>
<textarea rows="5" placeholder="Describe las tareas y responsabilidades"></textarea>

<h2>Habilidades</h2>

<label>Habilidades personales:</label>
<textarea rows="4" placeholder="Responsabilidad, puntualidad, trabajo en equipo, etc."></textarea>

<label>Habilidades técnicas:</label>
<textarea rows="4" placeholder="Describe tus conocimientos técnicos"></textarea>

<h2>Referencias laborales</h2>

<label>Nombre y contacto:</label>
<textarea rows="3" placeholder="Escribe tus referencias laborales (opcional)"></textarea>

<button type="reset">Limpiar formulario</button>

</form>
</main>

</body>
</html>
